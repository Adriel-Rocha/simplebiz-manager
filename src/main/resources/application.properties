spring.application.name=simplebiz-manager

# Server
server.port=${PORT:8080}

# Datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/simplebiz?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:simplebiz}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Springdoc OpenAPI (Swagger)
springdoc.swagger-ui.path=/swagger

# JWT
app.jwt.secret=${JWT_SECRET:change-this-local-secret-before-production}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Demo dataset
# Set to true in the demo environment only.
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
